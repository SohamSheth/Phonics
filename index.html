<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<!-- ARTIFACT-START -->
<title>Blend and Read</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one big play card centred on a sky "classroom wall"; home is a grid of chunky game tiles. */
:root {
  --sky: #b9e3fb;
  --sky-deep: #8fcff3;
  --paper: #ffffff;
  --ink: #1d2742;
  --ink-soft: #55607d;
  --dot: #ef4b3f;        /* sound-button red, like the dots on school word cards */
  --grass: #2fa865;
  --sun: #ffc23a;
  --plum: #7b4fd6;
  --line: #d6e6f2;
  --font-word: "Andika", "Comic Sans MS", "Trebuchet MS", sans-serif; /* single-storey a and g, as children learn */
  --font-display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  background-image: radial-gradient(circle at 1px 1px, var(--sky-deep) 1.5px, transparent 0);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font-word);
  font-size: 18px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--plum); outline-offset: 3px; }
button:disabled { opacity: .45; cursor: default; }

.app { min-height: 100%; display: flex; flex-direction: column; }
.top {
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; margin: 0; flex: 1; letter-spacing: .5px; }
.top h1 span { color: var(--dot); }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--paper); border-radius: 999px; padding: 6px 14px;
  font-family: var(--font-display); font-weight: 800; font-size: 1.2rem;
  box-shadow: 0 3px 0 var(--sky-deep);
}
.iconbtn { width: 52px; height: 52px; border-radius: 16px; background: var(--paper); font-size: 1.6rem; box-shadow: 0 4px 0 var(--sky-deep); }
.iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-deep); }

main {
  flex: 1; width: 100%; max-width: 900px; margin: 0 auto;
  padding-block: 8px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Home */
.hello { display: flex; align-items: center; gap: 14px; margin: 4px 0 18px; }
.owl { font-size: 3.4rem; animation: bob 2.4s ease-in-out infinite; }
.bubble { background: var(--paper); border-radius: 20px; padding: 12px 18px; font-size: 1.2rem; position: relative; box-shadow: 0 4px 0 var(--sky-deep); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.tile {
  background: var(--paper); border-radius: 26px; padding: 18px 16px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  box-shadow: 0 6px 0 var(--c, var(--sky-deep));
  border: 4px solid var(--c, var(--sky-deep));
  transition: transform .12s;
}
.tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--c); }
.tile .ic { font-size: 3rem; line-height: 1.1; }
.tile b { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; }
.tile small { color: var(--ink-soft); font-size: .95rem; }
.levelnote { margin-top: 18px; text-align: center; color: var(--ink-soft); font-size: 1rem; }

/* Play card */
.card {
  background: var(--paper); border-radius: 30px; padding: 22px 18px 26px;
  box-shadow: 0 8px 0 var(--sky-deep);
  display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;
}
.progress { display: flex; gap: 8px; justify-content: center; }
.progress i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
.progress i.on { background: var(--sun); }
.progress i.now { background: var(--plum); transform: scale(1.2); }
.prompt { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; margin: 0; text-wrap: balance; }

/* Sound buttons */
.word { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.g {
  display: flex; flex-direction: column; align-items: center;
  padding: 0 6px 10px; border-radius: 18px; min-width: 64px;
  transition: background .15s, transform .15s;
}
.g .gl { font-size: clamp(3.4rem, 15vw, 6rem); line-height: 1.15; font-weight: 700; }
.g .mark { width: 18px; height: 18px; border-radius: 50%; background: var(--dot); }
.g.di .mark { width: 80%; height: 10px; border-radius: 6px; margin-top: 4px; }
.g.lit { background: #fff1c7; transform: translateY(-6px) scale(1.06); }
.g.done .mark { background: var(--grass); }
.word.small .g { min-width: 0; padding: 0 3px 6px; }
.word.small .g .gl { font-size: clamp(2.2rem, 9vw, 3.2rem); }
.word.small .g .mark { width: 12px; height: 12px; }
.word.small .g.di .mark { height: 7px; }
.swoosh { height: 10px; width: 0; background: var(--plum); border-radius: 6px; transition: width .9s ease-in-out; margin-top: -10px; }
.swoosh.go { width: min(80%, 340px); }

.big {
  font-family: var(--font-display); font-weight: 800; font-size: 1.5rem;
  padding: 14px 30px; border-radius: 22px; color: #fff; background: var(--grass);
  box-shadow: 0 6px 0 #1f7a47;
}
.big:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #1f7a47; }
.big.purple { background: var(--plum); box-shadow: 0 6px 0 #55339e; }
.big.light { background: var(--paper); color: var(--ink); box-shadow: 0 6px 0 var(--line); border: 3px solid var(--line); }
.row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

.pic { font-size: clamp(6rem, 30vw, 9rem); line-height: 1.1; }
.pic.pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 560px; }
.choice {
  background: var(--paper); border: 4px solid var(--line); border-radius: 24px;
  font-size: clamp(3.2rem, 15vw, 5rem); padding: 10px 0; box-shadow: 0 5px 0 var(--line);
}
.choice.right { border-color: var(--grass); background: #e3f7ea; }
.shake { animation: shake .45s; }

/* Spell it */
.slots { display: flex; gap: 10px; justify-content: center; }
.slot {
  min-width: 70px; height: 92px; border-radius: 18px; border: 4px dashed var(--line);
  font-size: 3.4rem; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 8px;
}
.slot.full { border-style: solid; border-color: var(--sun); background: #fff8e3; }
.slot.good { border-color: var(--grass); background: #e3f7ea; }
.tiles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 520px; }
.tilebtn {
  min-width: 68px; height: 72px; border-radius: 18px; padding: 0 12px;
  background: var(--sun); font-size: 2.6rem; font-weight: 700; box-shadow: 0 5px 0 #c9901b;
}
.tilebtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c9901b; }
.tilebtn.used { visibility: hidden; }

/* Balloons */
.sky { position: relative; width: 100%; height: 360px; overflow: hidden; border-radius: 24px; background: linear-gradient(#dff3ff, #f4fbff); }
.balloon {
  position: absolute; bottom: -160px; width: min(23%, 120px); aspect-ratio: 6 / 7; max-width: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; font-weight: 700; color: var(--ink);
  border-radius: 50% 50% 46% 46%; background: var(--bc);
  animation: rise var(--dur) linear var(--delay) infinite;
  box-shadow: inset -10px -12px 0 rgba(0,0,0,.08);
}
.balloon::after { content: ""; position: absolute; top: 100%; left: 50%; width: 2px; height: 50px; background: #9aaabb; }
.balloon.popped { animation: burst .35s forwards; }
.balloon.wobble { animation: rise var(--dur) linear var(--delay) infinite, wob .4s; }

/* Alien */
.planet { background: #251d4a; color: #fff; border-radius: 26px; padding: 18px 26px 10px; }
.planet .g .mark { background: #ff8a7a; }
.planet .g.lit { background: #3d3170; }
.sortbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 520px; }
.sortbtn { border-radius: 24px; padding: 14px 8px; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 4px solid; }
.sortbtn span { font-size: 3.2rem; line-height: 1.1; }
.sortbtn.real { background: #fff6d8; border-color: var(--sun); }
.sortbtn.alien { background: #ece4ff; border-color: var(--plum); }

/* Stories */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.cover { border-radius: 22px; padding: 16px; text-align: left; background: var(--paper); box-shadow: 0 6px 0 var(--bc); border: 4px solid var(--bc); display: flex; flex-direction: column; gap: 6px; }
.cover .ic { font-size: 3rem; }
.cover b { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.2; }
.cover small { color: var(--ink-soft); }
.badge { display: inline-block; font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 10px; border-radius: 999px; background: var(--line); color: var(--ink); width: fit-content; }
.badge.done { background: #e3f7ea; color: #1f7a47; }
.page { border-radius: 30px; background: var(--paper); box-shadow: 0 8px 0 var(--sky-deep); overflow: hidden; }
.scene { background: var(--bc); font-size: clamp(4rem, 20vw, 7.5rem); text-align: center; padding: 26px 10px; line-height: 1.2; letter-spacing: .1em; }
.text { padding: 22px 16px 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; }
.tw { font-size: clamp(2rem, 8vw, 3rem); font-weight: 700; padding: 2px 6px; border-radius: 12px; border-bottom: 5px solid transparent; }
.tw.tricky { border-bottom-color: var(--sun); }
.tw.lit { background: #fff1c7; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px 20px; }
.pager .count { color: var(--ink-soft); font-weight: 700; }
.popout { position: fixed; inset: 0; background: rgba(29,39,66,.45); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.popout .card { max-width: 520px; width: 100%; }
.key { color: var(--ink-soft); font-size: .95rem; text-align: center; margin: 12px 0 0; }
.key i { display: inline-block; width: 26px; height: 5px; background: var(--sun); border-radius: 3px; vertical-align: middle; margin-right: 6px; }

/* Stickers */
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 12px; width: 100%; }
.stk { aspect-ratio: 1; max-width: 100%; border-radius: 22px; background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 2.8rem; border: 3px dashed var(--line); }
.stk.got { border: 3px solid var(--sun); background: #fff8e3; }
.stk.locked { color: var(--line); font-family: var(--font-display); font-size: 2rem; }

/* Grown-ups */
.panel { background: var(--paper); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: left; box-shadow: 0 6px 0 var(--sky-deep); }
.panel h2 { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
.panel p, .panel li { font-size: 1rem; line-height: 1.55; color: var(--ink); max-width: 65ch; }
.panel ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { padding: 10px 16px; border-radius: 14px; border: 3px solid var(--line); font-weight: 700; font-size: 1rem; }
.opt.on { border-color: var(--plum); background: #ece4ff; }
select, input[type=range] { font: inherit; font-size: 1rem; max-width: 100%; }
select { padding: 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
.recgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.rec { border: 2px solid var(--line); border-radius: 14px; padding: 8px; display: flex; align-items: center; gap: 6px; }
.rec b { font-size: 1.6rem; flex: 1; }
.rec button { width: 34px; height: 34px; border-radius: 10px; background: var(--line); font-size: 1rem; }
.rec.has { border-color: var(--grass); }
.rec.recording { border-color: var(--dot); background: #ffe7e4; }
.muted { color: var(--ink-soft); font-size: .95rem; }
.hold { position: relative; overflow: hidden; }
.hold .fill { position: absolute; inset: 0; width: 0; background: rgba(123,79,214,.25); }

/* Celebrate */
.confetti { position: fixed; top: -60px; font-size: 2.2rem; pointer-events: none; animation: fall var(--t) linear forwards; z-index: 30; }
.win .pic { animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
.starsrow { font-size: 2.6rem; letter-spacing: .1em; }

/* Book maker */
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 8 / 5; overflow: hidden; container-type: inline-size; background: var(--sky); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fig { position: absolute; transform: translate(-50%, -50%); line-height: 1; animation: float 3.2s ease-in-out infinite; filter: drop-shadow(0 4px 2px rgba(0,0,0,.18)); }
.fig.s1 { font-size: 3.4rem; font-size: 8cqw; }
.fig.s2 { font-size: 4.6rem; font-size: 12cqw; }
.fig.s3 { font-size: 6rem; font-size: 17cqw; }
.tw.name { border-bottom-color: transparent; color: var(--plum); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-weight: 700; font-size: .95rem; }
textarea, input[type=text], input[type=password] {
  font: inherit; font-size: 1.05rem; width: 100%; max-width: 100%; padding: 10px 12px; border-radius: 14px;
  border: 3px solid var(--line); background: var(--paper); color: var(--ink); user-select: text; -webkit-user-select: text;
}
textarea:focus, input:focus { outline: none; border-color: var(--plum); }
.stagepick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.stagepick .opt { text-align: left; display: flex; flex-direction: column; gap: 2px; }
.stagepick .opt small { font-weight: 400; color: var(--ink-soft); }
.status { font-weight: 700; color: var(--plum); min-height: 1.4em; margin: 0; }
.status.err { color: var(--dot); }
.edpage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 14px; align-items: start; border-top: 2px solid var(--line); padding-top: 14px; }
.edpage .stage { border-radius: 16px; }
.edfields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.edrow { display: flex; gap: 8px; flex-wrap: wrap; }
.edrow > * { flex: 1 1 140px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 1.05rem; }
.chips span { padding: 0 4px; border-bottom: 4px solid transparent; }
.chips .tricky { border-bottom-color: var(--sun); }
.chips .name { color: var(--plum); }
.chips .hard { border-bottom: 4px dotted var(--dot); color: var(--dot); font-weight: 700; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--ink-soft); }
.legend b { padding: 0 4px; }
.legend .tricky { border-bottom: 4px solid var(--sun); }
.legend .hard { border-bottom: 4px dotted var(--dot); color: var(--dot); }
.mybook { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 2px solid var(--line); padding-top: 10px; }
.mybook .t { flex: 1 1 160px; min-width: 0; font-weight: 700; }
.small { font-size: 1rem; padding: 8px 14px; border-radius: 14px; box-shadow: 0 4px 0 var(--line); }
.cover .mini { border-radius: 12px; }
@media (max-width: 600px) { .edpage { grid-template-columns: 1fr; } }
@keyframes float { 50% { transform: translate(-50%, -57%); } }

@keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
@keyframes rise { from { transform: translateY(0); } to { transform: translateY(-560px); } }
@keyframes burst { to { transform: scale(1.8); opacity: 0; } }
@keyframes wob { 25% { margin-left: -8px; } 75% { margin-left: 8px; } }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .balloon { animation: none !important; bottom: auto; top: var(--top); }
}
@media (max-width: 480px) {
  .top h1 { font-size: 1.25rem; }
  .games { grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile .ic { font-size: 2.4rem; }
  .tile b { font-size: 1.1rem; }
  .tile small { display: none; }
  .big { font-size: 1.25rem; padding: 12px 22px; }
  .slot { min-width: 56px; height: 76px; font-size: 2.6rem; }
  .tilebtn { min-width: 58px; height: 64px; font-size: 2.2rem; }
  .balloon { font-size: 1.3rem; }
}
</style>

<div class="app">
  <header class="top">
    <button class="iconbtn" id="homeBtn" aria-label="Home">🏠</button>
    <h1>Blend <span>&amp;</span> Read</h1>
    <span class="chip" aria-label="Stars"><span>⭐</span><span id="starCount">0</span></span>
  </header>
  <main id="screen"></main>
</div>

<script>
(() => {
'use strict';

/* ---------- Word lists ---------- */
// Phase 2 style CVC words (mostly 3 letters). Each picture is unique so matching games stay fair.
const CVC = [
  ['cat','🐱'],['dog','🐶'],['pig','🐷'],['hen','🐔'],['fox','🦊'],['bat','🦇'],['bus','🚌'],['sun','☀️'],
  ['hat','🎩'],['bed','🛏️'],['cup','🥤'],['mug','☕'],['pen','🖊️'],['map','🗺️'],['van','🚐'],['box','📦'],
  ['bug','🐛'],['rat','🐀'],['net','🥅'],['web','🕸️'],['pin','📌'],['log','🪵'],['ant','🐜'],['jet','✈️'],
  ['leg','🦵'],['lip','👄'],['nut','🥜'],['ram','🐏'],['ten','🔟'],['six','6️⃣'],['tap','🚰'],['zip','🤐'],
  ['hut','🛖'],['kid','🧒'],['man','👨'],['mum','👩'],['dad','🧔'],['bin','🗑️'],['cap','🧢'],['can','🥫'],
  ['ham','🍖'],['dig','⛏️'],['run','🏃'],['nap','😴'],['hug','🤗'],['wet','💦'],['hot','🔥'],['red','🔴'],
  ['sad','😢'],['pup','🐕'],['cub','🐻'],['yak','🐃'],['rod','🎣'],['pan','🍳'],['bag','👜'],['tub','🛁'],
  ['pot','🍯'],['gem','💎'],['cog','⚙️'],['mop','🧹'],['bud','🌱'],['zap','⚡'],['yes','✅'],['egg','🥚']
].map(([w,e]) => ({ w, e, set: 'cvc' }));

// Phase 3 style words with digraphs (two or three letters making one sound).
const DIGRAPH = [
  ['duck','🦆'],['sock','🧦'],['rock','🪨'],['bell','🔔'],['doll','🪆'],['hill','⛰️'],['kiss','💋'],['fish','🐟'],
  ['ship','🚢'],['shop','🏪'],['shell','🐚'],['chip','🍟'],['chick','🐥'],['bath','🛀'],['ring','💍'],['king','🤴'],
  ['bee','🐝'],['tree','🌳'],['feet','🦶'],['moon','🌙'],['book','📖'],['boat','⛵'],['goat','🐐'],['rain','🌧️'],
  ['coin','🪙'],['cow','🐄'],['owl','🦉'],['car','🚗'],['star','⭐'],['farm','🚜'],['fork','🍴'],['corn','🌽'],
  ['horn','📯'],['night','🌃'],['light','💡'],['queen','👸'],['shark','🦈'],['torch','🔦'],['sheep','🐑'],['teeth','🦷'],
  ['chair','🪑'],['ear','👂'],['chain','⛓️'],['soap','🧼'],['toad','🐸'],['boot','👢'],['spoon','🥄'],['nail','💅'],
  ['snail','🐌'],['train','🚂'],['coat','🧥']
].map(([w,e]) => ({ w, e, set: 'dig' }));

const ALIEN = {
  cvc: ['zop','vap','tig','mip','dut','fip','lom','sib','pab','jat','nid','reb','hux','gan','bim','kep','wug','fot','dem','lut','vot','yeb'],
  dig: ['chom','shep','thib','zook','feeb','moak','shoon','chab','quom','roip','narb','veck','jair','thog','sheb','mook']

const MULTI = ['igh','air','ear','ure','ch','sh','th','ng','nk','ck','ll','ss','ff','zz','gg','qu','wh','ph','ai','ee','oa','oo','ar','or','ur','ow','oi','er',
  'ay','ou','ie','ea','oy','ir','ue','aw','ew','oe','au','ey'];
function split(word) {
  const w = word.toLowerCase(); const out = []; let i = 0;
  while (i < w.length) { const m = MULTI.find(g => w.startsWith(g, i)) || w[i]; out.push(m); i += m.length; }
  return out;
}

/* ---------- Storage (safe if blocked) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('blendread.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('blendread.' + k, JSON.stringify(v)); } catch (e) {} }
};

const recorded = {}; // grapheme -> object URL
const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('blendread', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('sounds');
        r.onsuccess = () => { idb.db = r.result; res(r.result); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  tx(mode) { return idb.db.transaction('sounds', mode).objectStore('sounds'); },
  put(k, v) { return new Promise((res, rej) => { const r = idb.tx('readwrite').put(v, k); r.onsuccess = res; r.onerror = rej; }); },
  del(k) { return new Promise((res, rej) => { const r = idb.tx('readwrite').delete(k); r.onsuccess = res; r.onerror = rej; }); },
  all() {
    return new Promise((res, rej) => {
      const out = {}; const r = idb.tx('readonly').openCursor();
      r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      r.onerror = rej;
    });
  }
};
idb.open().then(idb.all).then(all => { for (const k in all) recorded[k] = URL.createObjectURL(all[k]); }).catch(() => {});

/* ---------- Speech ---------- */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) { voices = []; } }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  if (S.voice) { const v = voices.find(v => v.name === S.voice); if (v) return v; }
  return voices.find(v => v.lang === 'en-GB' && /female|serena|kate|libby|sonia|google uk english female/i.test(v.name))
    || voices.find(v => v.lang === 'en-GB') || voices.find(v => /^en/i.test(v.lang)) || null;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
let run = 0; // bump to cancel any speaking sequence in progress
function hush() { run++; try { speechSynthesis.cancel(); } catch (e) {} }
function say(text, rate) {
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
    u.rate = rate || S.rate; u.pitch = 1.05;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 900 + text.length * 160 / u.rate);
    speechSynthesis.speak(u);
  });
}
function playUrl(url) {
  return new Promise(res => { const a = new Audio(url); a.onended = res; a.onerror = res; a.play().catch(res); setTimeout(res, 2500); });
}
function playSound(g) { return recorded[g] ? playUrl(recorded[g]) : say(SOUND[g] || g, 0.75); }

// Say each sound, lighting its button, then blend into the whole word.
async function blend(word, btns, gap = 260) {
  const my = ++run; const gs = split(word);
  for (let i = 0; i < gs.length; i++) {
    if (my !== run) return;
    btns && btns[i] && btns[i].classList.add('lit');
    await playSound(gs[i]);
    btns && btns[i] && btns[i].classList.remove('lit');
    await wait(gap);
  }
  if (my !== run) return;
  await say(word);
}

function confetti(n = 18) {

function holdToOpen(btn, fn) {
  let t = null, start = 0; const fill = btn.querySelector('.fill');
  const tick = () => { const p = Math.min(1, (Date.now() - start) / 1500); fill.style.width = p * 100 + '%'; if (p >= 1) { stop(); fn(); } else t = requestAnimationFrame(tick); };
  const begin = e => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (err) {} start = Date.now(); cancelAnimationFrame(t); t = requestAnimationFrame(tick); };
  const stop = () => { cancelAnimationFrame(t); fill.style.width = '0'; };
  btn.addEventListener('pointerdown', begin); btn.addEventListener('pointerup', stop); btn.addEventListener('pointercancel', stop); btn.addEventListener('lostpointercapture', stop);
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fn(); });
}

/* ---------- Game: Spell It ---------- */
function qSpell(item) {
  const gs = split(item.w);
  const extras = shuffle([...new Set(pool().flatMap(x => split(x.w)))].filter(g => !gs.includes(g) && (g.length === 1 || item.set === 'dig'))).slice(0, gs.length > 3 ? 2 : 3);
  const tiles = shuffle(gs.concat(extras));
  const placed = Array(gs.length).fill(null); // index into tiles
  screen(`<div class="card">${progressHTML()}
    <p class="prompt">What is it? Build the word!</p>
    <div class="pic">${item.e}</div>
    <button class="big light" id="hear">🔊 Hear the word</button>
    <div class="slots">${gs.map((_, i) => `<button class="slot" data-s="${i}" aria-label="space ${i + 1}"></button>`).join('')}</div>
    <div class="tiles">${tiles.map((t, i) => `<button class="tilebtn" data-t="${i}">${t}</button>`).join('')}</div>
    <button class="big" id="nextBtn" hidden>Next ➜</button>
  </div>`);
  let tries = 0;
  const draw = () => {
    $$('.slot').forEach((s, i) => { s.textContent = placed[i] == null ? '' : tiles[placed[i]]; s.classList.toggle('full', placed[i] != null); });
    $$('.tilebtn').forEach((b, i) => b.classList.toggle('used', placed.includes(i)));
  };
  const check = async () => {
    if (placed.some(p => p == null)) return;
    if (placed.every((p, i) => tiles[p] === gs[i])) {
      $$('.slot').forEach(s => s.classList.add('good')); $$('.tilebtn').forEach(b => b.disabled = true);
      if (tries === 0) addStar(); confetti(12); $('#nextBtn').hidden = false;
      await blend(item.w, $$('.slot'), 120); praise();
    } else {
      tries++; shakeEl($('.slots')); say('Not quite. Listen again.');
      placed.forEach((p, i) => { if (tiles[p] !== gs[i]) placed[i] = null; }); draw();
    }
  };
  $$('.tilebtn').forEach(b => b.onclick = () => {
    const i = placed.indexOf(null); if (i < 0) return;
    placed[i] = +b.dataset.t; draw(); hush(); playSound(tiles[b.dataset.t]); setTimeout(check, 500);
  });
  $$('.slot').forEach(s => s.onclick = () => { if ($('#nextBtn').hidden) { placed[s.dataset.s] = null; draw(); } });
  $('#hear').onclick = async () => { hush(); await say(item.w); };
  $('#nextBtn').onclick = next;
  setTimeout(() => say(item.w), 300);
}

async function recAction(box, act) {
  const g = box.dataset.g; const msg = $('#recMsg');
  if (act === 'play') { if (recorded[g]) playUrl(recorded[g]); else playSound(g); return; }
  if (act === 'del') {
    if (recorded[g]) { URL.revokeObjectURL(recorded[g]); delete recorded[g]; }
    try { await idb.del(g); } catch (e) {}
    box.classList.remove('has'); return;
  }
  try {
    if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('unsupported');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream); const chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); box.classList.remove('recording');
      const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
      if (recorded[g]) URL.revokeObjectURL(recorded[g]);
      recorded[g] = URL.createObjectURL(blob); box.classList.add('has');
      try { if (!idb.db) await idb.open(); await idb.put(g, blob); msg.textContent = ''; }
      catch (e) { msg.textContent = 'Saved for now, but this browser will forget it when the page closes.'; }
      playUrl(recorded[g]);
    };
    box.classList.add('recording'); rec.start(); setTimeout(() => rec.state !== 'inactive' && rec.stop(), 1500);
  } catch (e) {
    msg.textContent = 'This browser will not let the app use the microphone here. Open the app from its GitHub Pages link (see README) and allow the microphone.';
  }
}

/* ---------- Stages: which sounds and tricky words a child knows ---------- */

const P5 = P3.concat(['ay','ou','ie','ea','oy','ir','ue','aw','wh','ph','ew','oe','au','ey']);
const T2 = ['the','to','i','no','go','into','is','as','has','his','a','put','pull','full','push','of'];
const T3 = T2.concat(['he','she','we','me','be','was','you','they','all','are','my','her']);
const T4 = T3.concat(['said','so','have','like','some','come','were','there','little','one','do','when','out','what','says','here','today']);
const T5 = T4.concat(['oh','their','people','mr','mrs','looked','called','asked','could','would','should','water','where','who','again',
  'thought','through','work','mouse','many','laughed','because','different','any','eyes','friends','once','please']);
const STAGES = {
  p2: { name: 'Stage 1', sub: 'Three-letter words', eg: 'cat, sun, big', g: P2, t: T2, clusters: false, max: 6,
        rule: 'Words must be short, like cat, sun, big, hen, dog. No two consonant sounds next to each other (so no "frog", "jump", "stop"), except a plural s at the end (cats).' },
  p3: { name: 'Stage 2', sub: 'Special friends: sh ch th ng ee oo ai ar…', eg: 'ship, moon, rain', g: P3, t: T3, clusters: false, max: 8,
        rule: 'Words may use two-letter and three-letter sounds like ship, chip, moon, rain, night, car, fork. No two consonant sounds next to each other (so no "frog", "jump", "stop"), except a plural s at the end.' },
  p4: { name: 'Stage 3', sub: 'Blends like fr, st, mp', eg: 'frog, jump, stop', g: P3, t: T4, clusters: true, max: 10,
        rule: 'Words may have consonant blends at the start or end, like frog, jump, stop, milk, tent, sweets. Only use the sounds listed; no other spellings of sounds.' },
  p5: { name: 'Stage 4', sub: 'More ways to spell sounds', eg: 'play, cake, cloud', g: P5, t: T5, clusters: true, max: 12, split: true,
        rule: 'Words may also use alternative spellings like play, cloud, pie, sea, boy, bird, blue, saw, new, and split digraphs like cake, time, home, cute, these.' }

const STAGE_KEYS = Object.keys(STAGES);

function cleanWord(t) { return String(t).toLowerCase().replace(/[’']s$/, '').replace(/[^a-z]/g, ''); }
function isSplitDigraph(w) { return /^[^aeiou]*[aeiou][^aeiouwy]e(s|d)?$/.test(w) && !/(ee|oe|ie|ue|ye)$/.test(w); }

// 'ok' (can be sounded out), 'tricky' (taught tricky word), 'name', or 'hard' (above this stage)

    asr = await tf.pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', {

      <div class="edrow">
        <div class="field"><label for="kidName">Child’s name (optional)</label><input type="text" id="kidName" value="${esc(M.name)}" autocomplete="off"></div>
        <div class="field"><span class="lbl">Pages</span><div class="opts">${[4, 6, 8].map(n => `<button class="opt ${M.pages === n ? 'on' : ''}" data-pg="${n}">${n}</button>`).join('')}</div></div>
      </div>
    </section>
    <section class="panel">
      <h2>3. Make the book</h2>
      <p class="muted" id="writerNote"></p>
      <details id="keyBox" hidden><summary class="lbl">Use your own Claude API key</summary>
        <p class="muted">The key is saved only in this browser on this device and is sent only to Anthropic. Anyone using this device could use it, so only add it on your own device.</p>
        <div class="edrow"><input type="password" id="apiKey" placeholder="sk-ant-…" autocomplete="off"><button class="big light small" id="saveKey" style="flex:0 0 auto">Save key</button></div>
      </details>
      <div class="row" style="justify-content:flex-start"><button class="big purple" id="makeBtn">✨ Make the book</button><button class="big light" id="stopBtn" hidden>Stop</button></div>
      <p class="status" id="gStatus" role="status"></p>
    </section>
  </div>`);

  const tStatus = (m, err) => { $('#tStatus').textContent = m; $('#tStatus').classList.toggle('err', !!err); };
  const gStatus = (m, err) => { $('#gStatus').textContent = m; $('#gStatus').classList.toggle('err', !!err); };
  const ideaBox = $('#idea');
  const addText = t => { if (!t) return; ideaBox.value = (ideaBox.value.trim() ? ideaBox.value.trim() + ' ' : '') + t; M.idea = ideaBox.value; };
  ideaBox.oninput = () => { M.idea = ideaBox.value; };
  $('#kidName').oninput = e => { M.name = e.target.value.trim(); store.set('kidname', M.name); };
  $$('[data-st]').forEach(b => b.onclick = () => { M.stage = b.dataset.st; $$('[data-st]').forEach(x => x.classList.toggle('on', x === b)); });
  $$('[data-pg]').forEach(b => b.onclick = () => { M.pages = +b.dataset.pg; $$('[data-pg]').forEach(x => x.classList.toggle('on', x === b)); });

  const runTranscribe = async blob => {
    try { addText(await transcribe(blob, m => tStatus(m))); tStatus(ideaBox.value ? 'Done. Check the words below and fix anything it misheard.' : 'I could not hear any words in that recording.'); }
    catch (e) { tStatus('Voice notes cannot be turned into text here. ' + (canDictate ? 'Try 🗣 Dictate, or type the idea.' : 'Please type the idea instead.') + ' (Voice notes work when the app is opened from its own web address, for example GitHub Pages.)', true); }
  };
  $('#upBtn').onclick = () => $('#upFile').click();
  $('#upFile').onchange = e => { const f = e.target.files[0]; if (f) runTranscribe(f); e.target.value = ''; };

  let rec = null;
  $('#recBtn').onclick = async () => {
    if (rec) { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = []; rec = new MediaRecorder(stream);
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); $('#recBtn').textContent = '🎙 Record'; const r = rec; rec = null; runTranscribe(new Blob(chunks, { type: r.mimeType || 'audio/webm' })); };
      rec.start(); $('#recBtn').textContent = '⏹ Stop recording'; tStatus('Recording… tell the story, then press Stop.');
      setTimeout(() => rec && rec.state === 'recording' && rec.stop(), 180000);
    } catch (e) { rec = null; tStatus('The microphone is not available here. ' + (canDictate ? 'Try 🗣 Dictate, upload a recording, or type the idea.' : 'Upload a recording or type the idea.'), true); }
  };

  if (canDictate) {
    let sr = null;
    $('#dictBtn').onclick = () => {
      if (sr) { sr.stop(); return; }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      sr = new SR(); sr.lang = 'en-GB'; sr.continuous = true; sr.interimResults = false;
      sr.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) addText(e.results[i][0].transcript.trim()); };
      sr.onerror = e => tStatus(e.error === 'not-allowed' ? 'The microphone is not available here. Please type the idea.' : 'Dictation stopped. Press 🗣 Dictate to carry on.', true);
      sr.onend = () => { sr = null; $('#dictBtn').textContent = '🗣 Dictate'; };
      try { sr.start(); $('#dictBtn').textContent = '⏹ Stop dictating'; tStatus('Listening… tell the story.'); } catch (e) { sr = null; }
    };
  }

  writerKind().then(k => {
    $('#writerNote').textContent = k === 'claude' ? 'Claude will write the book, then every word is checked against the stage.'
      : k === 'api' ? 'Claude will write the book using your API key, then every word is checked against the stage.'
      : 'No book writer is connected, so the app will split your idea into pages and you can simplify the words yourself. Words above the stage are marked in red. To have Claude write it, add an API key below.';
    $('#keyBox').hidden = k === 'claude';
  });
  $('#saveKey').onclick = () => { const v = $('#apiKey').value.trim(); store.set('apikey', v); $('#apiKey').value = ''; maker(); };

  let ctl = null;
  $('#stopBtn').onclick = () => ctl && ctl.abort();
  $('#makeBtn').onclick = async () => {
    M.idea = ideaBox.value.trim();
    if (!M.idea) { gStatus('Add a story idea first.', true); ideaBox.focus(); return; }
    ctl = new AbortController(); $('#makeBtn').disabled = true; $('#stopBtn').hidden = false;
    try { const book = await makeBook({ idea: M.idea, stage: M.stage, pages: M.pages, name: M.name }, m => gStatus(m), ctl.signal); editor(book); }
    catch (e) { gStatus(e.message || 'Something went wrong. Try again.', true); }
    finally { if ($('#makeBtn')) { $('#makeBtn').disabled = false; $('#stopBtn').hidden = true; } }
  };
}

/* ---------- Editor: check, tweak and save the book ---------- */
function chipsHTML(text, book) {
  return text.split(/\s+/).filter(Boolean).map(t => {
    const c = classify(t, book.stage, book.names);
    return `<span class="${c === 'ok' ? '' : c}" ${c === 'hard' ? 'title="Above this stage"' : ''}>${esc(t)}</span>`;
  }).join('');
}
function editor(book) {
  G = null;
  const st = STAGES[book.stage]; const si = STAGE_KEYS.indexOf(book.stage);
  const summary = () => {
    const ws = bookWords(book); const cs = ws.map(t => classify(t, book.stage, book.names));
    const hard = hardWords(book);
    return `${ws.length} words · ${cs.filter(c => c === 'tricky').length} tricky · ${hard.length ? `<b style="color:var(--dot)">${hard.length} above ${st.name}: ${esc(hard.join(', '))}</b>` : `<b style="color:var(--grass)">every word fits ${st.name} ✓</b>`}`;
  };
  screen(`<div class="stack">
    <section class="panel">
      <h2>Check your book</h2>
      <div class="field"><label for="bTitle">Title</label><input type="text" id="bTitle" value="${esc(book.title)}"></div>
      <p id="sum">${summary()}</p>
      <div class="legend"><span><b>plain</b> = can sound out</span><span><b class="tricky">yellow</b> = tricky word</span><span><b class="hard">red</b> = too hard, change it</span></div>
      <div class="row" style="justify-content:flex-start">
        <button class="big" id="saveBook">💾 Save to bookshelf</button>
        ${book.idea ? `${si > 0 ? `<button class="big light small" id="easier">Make it easier (${STAGES[STAGE_KEYS[si - 1]].name})</button>` : ''}
        ${si < STAGE_KEYS.length - 1 ? `<button class="big light small" id="harder">Make it harder (${STAGES[STAGE_KEYS[si + 1]].name})</button>` : ''}` : ''}
      </div>
      <p class="status" id="eStatus" role="status"></p>
    </section>
    <section class="panel" id="pages">${book.pages.map((p, i) => `<div class="edpage" data-p="${i}">
      <div class="sc">${sceneHTML(p, 'mini')}</div>
      <div class="edfields">
        <div class="field"><label for="pt${i}">Page ${i + 1}</label><textarea id="pt${i}" rows="2" data-f="text">${esc(p.text)}</textarea></div>
        <div class="chips">${chipsHTML(p.text, book)}</div>
        <div class="edrow">
          <div class="field"><label for="ps${i}">Place</label><select id="ps${i}" data-f="setting">${Object.entries(SETTINGS).map(([k, v]) => `<option value="${k}" ${p.setting === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div>
          <div class="field"><label for="pf${i}">Pictures (emoji, with spaces between)</label><input type="text" id="pf${i}" data-f="figs" value="${esc(p.figures.map(f => f.e).join(' '))}"></div>
        </div>
      </div></div>`).join('')}</section>
  </div>`);
  const refresh = (i) => {
    const row = $(`.edpage[data-p="${i}"]`); const p = book.pages[i];
    row.querySelector('.sc').innerHTML = sceneHTML(p, 'mini');
    row.querySelector('.chips').innerHTML = chipsHTML(p.text, book);
    $('#sum').innerHTML = summary();
  };
  $('#bTitle').oninput = e => { book.title = e.target.value.slice(0, 60); $('#sum').innerHTML = summary(); };
  $$('.edpage').forEach(row => {
    const i = +row.dataset.p; const p = book.pages[i];
    row.querySelector('[data-f=text]').oninput = e => { p.text = e.target.value.replace(/\s+/g, ' ').slice(0, 160); refresh(i); };
    row.querySelector('[data-f=setting]').onchange = e => { p.setting = e.target.value; refresh(i); };
    row.querySelector('[data-f=figs]').oninput = e => {
      const es = (e.target.value.match(/\S+/g) || []).map(cleanEmoji).filter(Boolean).slice(0, 5);
      const xs = [30, 58, 82, 45, 70];
      p.figures = es.map((em, k) => p.figures[k] ? { ...p.figures[k], e: em } : { e: em, x: xs[k], y: 74, s: k ? 2 : 3 });
      refresh(i);
    };
  });
  $('#saveBook').onclick = async () => {
    book.pages = book.pages.filter(p => p.text.trim());
    if (!book.pages.length) { $('#eStatus').textContent = 'Add some words to at least one page.'; return; }
    book.title = book.title.trim() || 'Our Story';
    await MyBooks.save(book);
    $('#eStatus').textContent = 'Saved! Opening the book…';
    setTimeout(() => readStory(book, 0), 500);
  };
  const restage = async dir => {
    const stage = STAGE_KEYS[si + dir]; const btns = $$('#easier, #harder, #saveBook');
    btns.forEach(b => b.disabled = true);
    try {
      const nb = await makeBook({ idea: book.idea, stage, pages: book.pages.length, name: M.name || '' }, m => { $('#eStatus').textContent = m; });
      editor(nb);
    } catch (e) { $('#eStatus').textContent = e.message; btns.forEach(b => b.disabled = false); }
  };
  if ($('#easier')) $('#easier').onclick = () => restage(-1);
  if ($('#harder')) $('#harder').onclick = () => restage(1);
}

/* ---------- Start ---------- */
$('#homeBtn').onclick = home;
setStars();
home();
MyBooks.connect();
})();
</script>
